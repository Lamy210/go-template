services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      # PostgreSQL 18+ moved the image VOLUME from
      # /var/lib/postgresql/data to /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql

  nats:
    image: nats:2.15.2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
    command:
      - "-js"
      - "-m"
      - "8222"
      - "--store_dir"
      - "/data"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data

volumes:
  postgres-data:
  nats-data:
