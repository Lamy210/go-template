version: "2"
sql:
  - engine: "postgresql"
    schema: "sql/schema/schema.sql"
    queries: "sql/queries"
    gen:
      go:
        package: "exampledb"
        out: "internal/modules/example/store/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: false
        omit_unused_structs: true
