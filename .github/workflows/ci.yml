name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module files
        run: |
          go mod tidy
          git add -N go.sum
          git diff --exit-code -- go.mod go.sum

      - name: Download modules
        run: go mod download

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: make build VERSION=ci COMMIT="$GITHUB_SHA" BUILD_DATE=unknown

      - name: Docker build
        run: |
          docker build             --build-arg VERSION=ci             --build-arg COMMIT="$GITHUB_SHA"             --build-arg BUILD_DATE=unknown             --tag go-template:ci .

      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/app?sslmode=disable
      SQLC_VERSION: "1.31.1"
      SQLC_LINUX_AMD64_SHA256: "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354"
      ATLAS_IMAGE: arigaio/atlas:1.3.3-community

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install pinned sqlc
        run: |
          curl -fsSLo /tmp/sqlc.tar.gz             "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz"
          echo "${SQLC_LINUX_AMD64_SHA256}  /tmp/sqlc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sqlc.tar.gz -C /tmp
          sudo install /tmp/sqlc /usr/local/bin/sqlc
          sqlc version

      - name: Generate sqlc code
        run: sqlc generate

      - name: Recalculate migration integrity
        run: |
          docker run --rm             -v "$PWD:/workspace"             -w /workspace             "$ATLAS_IMAGE"             migrate hash --dir "file://migrations"

      - name: Print generated bootstrap artifacts
        run: |
          echo "===== migrations/atlas.sum ====="
          cat migrations/atlas.sum
          echo "===== sqlc generated files ====="
          for file in internal/modules/example/store/sqlc/*.go; do
            echo "===== $file ====="
            cat "$file"
          done

      - name: Apply fresh database migrations
        run: |
          docker run --rm --network host             -v "$PWD:/workspace"             -w /workspace             "$ATLAS_IMAGE"             migrate apply             --url "$DATABASE_URL"             --dir "file://migrations"

      - name: Run database integration tests
        run: go test -tags=integration ./test/integration/...

      - name: Verify generated artifacts are committed
        run: |
          git add -N migrations/atlas.sum
          find internal/modules/example/store/sqlc -name '*.go' -print0 | xargs -0 -r git add -N
          git diff --exit-code -- migrations/atlas.sum internal/modules/example/store/sqlc
